<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=960, height=540">
  <meta name="color-scheme" content="dark">
  <title>A Small Signal</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 960px; height: 540px; margin: 0; overflow: hidden; background: #070b12; }
    body { color: #e9f2f2; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    #stage { position: relative; width: 960px; height: 540px; overflow: hidden; background: radial-gradient(ellipse at 72% 48%, #102d36 0%, #0b1822 35%, #070b12 75%); }
    #haze { position: absolute; inset: -90px; opacity: .32; background: radial-gradient(ellipse at 50% 50%, #1e7b7a 0%, transparent 58%); filter: blur(34px); }
    #grain { position: absolute; inset: 0; opacity: .13; background-image: radial-gradient(#e6ffff 0.6px, transparent .8px); background-size: 7px 7px; mask-image: linear-gradient(90deg, #000, transparent 72%); }
    #grid { position: absolute; inset: 0; opacity: .14; background-image: linear-gradient(#84c5c322 1px, transparent 1px), linear-gradient(90deg, #84c5c322 1px, transparent 1px); background-size: 56px 56px; mask-image: linear-gradient(0deg, transparent, #000 35%, #000 70%, transparent); }
    #orbital { position: absolute; width: 510px; height: 510px; left: 225px; top: 17px; border: 1px solid #a9e3dc19; border-radius: 50%; transform: scale(.84); }
    #orbital:before, #orbital:after { content: ""; position: absolute; border: 1px solid #a9e3dc19; border-radius: 50%; inset: 46px; }
    #orbital:after { inset: 112px; border-color: #a9e3dc13; }
    #trail { position: absolute; inset: 0; width: 960px; height: 540px; }
    #route { fill: none; stroke: #8adbd0; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 850; stroke-dashoffset: 850; opacity: .75; filter: drop-shadow(0 0 7px #68d6c9); }
    #route2 { fill: none; stroke: #f4c88d; stroke-width: 1.5; stroke-linecap: round; stroke-dasharray: 800; stroke-dashoffset: 800; opacity: .82; }
    .node { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #a7f2dc; box-shadow: 0 0 10px 3px #64d9c8aa, 0 0 36px 10px #4cdbbf52; transform: scale(0); }
    #signal-a { left: 165px; top: 347px; }
    #signal-b { left: 747px; top: 190px; background: #ffe0a8; box-shadow: 0 0 10px 3px #f5c77aaa, 0 0 36px 10px #f3b75b52; }
    .ripple { position: absolute; width: 54px; height: 54px; margin: -22px; border: 1px solid #9ee8d488; border-radius: 50%; transform: scale(.1); opacity: 0; }
    #ripple-a { left: 170px; top: 352px; }
    #ripple-b { left: 752px; top: 195px; border-color: #ffe0a877; }
    #copy { position: absolute; left: 78px; top: 86px; width: 500px; }
    .kicker { color: #8bcfc8; font-size: 12px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
    h1 { margin: 20px 0 0; font-size: 65px; line-height: .94; letter-spacing: -3.4px; font-weight: 750; }
    h1 span { display: block; color: #a6ded4; }
    .line { width: 42px; height: 2px; margin: 23px 0 15px; background: #f4c88d; transform-origin: left; }
    .phrase { color: #b8c9c9; font-size: 15px; letter-spacing: .9px; }
    #chapter { position: absolute; left: 80px; bottom: 63px; color: #91a6aa; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; }
    #chapter strong { display: block; color: #d9e8e6; font-weight: 500; }
    #progress { position: absolute; left: 80px; right: 80px; bottom: 38px; height: 1px; background: #d7f7f326; }
    #progress-fill { width: 100%; height: 100%; transform: scaleX(0); transform-origin: left; background: #9adfd4; box-shadow: 0 0 8px #59d7c477; }
    #endmark { position: absolute; right: 112px; bottom: 77px; color: #dff4ee; font: 700 11px/1 ui-monospace, monospace; letter-spacing: 2px; opacity: 0; }
    #vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse, transparent 42%, #03070ba8 100%); }
  </style>
</head>
<body>
  <main id="stage" data-composition-id="main" data-start="0" data-duration="20" data-width="960" data-height="540" data-fps="24">
    <div id="haze"></div><div id="grid"></div><div id="grain"></div><div id="orbital"></div>
    <svg id="trail" viewBox="0 0 960 540" aria-hidden="true">
      <path id="route" d="M170 352 C250 315 285 383 350 330 S446 252 510 300 S615 349 682 250 S730 208 752 195" />
      <path id="route2" d="M170 352 C278 430 367 414 456 349 S604 240 752 195" />
    </svg>
    <div id="signal-a" class="node"></div><div id="signal-b" class="node"></div>
    <div id="ripple-a" class="ripple"></div><div id="ripple-b" class="ripple"></div>
    <section id="copy">
      <div id="kicker" class="kicker">A STUDY IN CONNECTION</div>
      <h1 id="title">A small <span>signal.</span></h1>
      <div id="title-line" class="line"></div>
      <p id="phrase" class="phrase">Somewhere in the quiet, a point begins to move.</p>
    </section>
    <div id="chapter"><strong id="chapter-name">01 / THE FIRST PULSE</strong><span id="chapter-time">00:00 — 00:05</span></div>
    <div id="endmark">STAY IN MOTION</div>
    <div id="progress"><div id="progress-fill"></div></div>
    <div id="vignette"></div>
  </main>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#haze", { opacity: 0 }, { opacity: .45, duration: 3, ease: "sine.out" }, 0);
    tl.fromTo("#orbital", { scale: .65, rotation: -18, opacity: 0 }, { scale: 1, rotation: 0, opacity: .8, duration: 4, ease: "power2.out" }, 0);
    tl.fromTo("#copy", { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 1.5, ease: "power3.out" }, .7);
    tl.fromTo("#signal-a", { scale: 0 }, { scale: 1, duration: .5, ease: "back.out(2)" }, 1.7);
    tl.fromTo("#ripple-a", { scale: .1, opacity: .8 }, { scale: 1.5, opacity: 0, duration: 2.6, repeat: 3, ease: "sine.out" }, 1.9);
    tl.to("#route", { strokeDashoffset: 0, duration: 8.2, ease: "none" }, 3.1);
    tl.to("#phrase", { textContent: "A path appears where attention is given.", duration: .01 }, 5.2);
    tl.to("#chapter-name", { textContent: "02 / THE LONG WAY THROUGH", duration: .01 }, 5.2);
    tl.to("#chapter-time", { textContent: "00:05 — 00:14", duration: .01 }, 5.2);
    tl.to("#signal-a", { scale: 1.24, duration: 1.3, repeat: 4, yoyo: true, ease: "sine.inOut" }, 6.2);
    tl.to("#orbital", { rotation: 12, duration: 8, ease: "sine.inOut" }, 6.1);
    tl.to("#phrase", { textContent: "Then the dark answers from far away.", duration: .01 }, 10.6);
    tl.to("#chapter-name", { textContent: "03 / THE ANSWER", duration: .01 }, 10.6);
    tl.to("#chapter-time", { textContent: "00:14 — 00:17", duration: .01 }, 10.6);
    tl.fromTo("#signal-b", { scale: 0 }, { scale: 1, duration: .65, ease: "back.out(2.4)" }, 12.5);
    tl.fromTo("#ripple-b", { scale: .1, opacity: .8 }, { scale: 1.6, opacity: 0, duration: 2.8, repeat: 2, ease: "sine.out" }, 12.8);
    tl.to("#route2", { strokeDashoffset: 0, duration: 3.5, ease: "power1.inOut" }, 13.4);
    tl.to("#phrase", { textContent: "One point becomes a meeting place.", duration: .01 }, 15.2);
    tl.to("#chapter-name", { textContent: "04 / THE MEETING", duration: .01 }, 15.2);
    tl.to("#chapter-time", { textContent: "00:17 — 00:20", duration: .01 }, 15.2);
    tl.to("#copy", { y: -20, opacity: 0, duration: 1.2, ease: "power2.in" }, 16.7);
    tl.to("#signal-a", { scale: 1.3, duration: .7, repeat: 2, yoyo: true, ease: "sine.inOut" }, 17.1);
    tl.to("#signal-b", { scale: 1.3, duration: .7, repeat: 2, yoyo: true, ease: "sine.inOut" }, 17.1);
    tl.to("#endmark", { opacity: 1, y: -6, duration: .8, ease: "power2.out" }, 17.5);
    tl.to("#progress-fill", { scaleX: 1, duration: 19.2, ease: "none" }, .3);
    tl.to("#stage", { opacity: 0, duration: .45, ease: "sine.in" }, 19.55);
    window.__timelines.main = tl;
    tl.seek(0);
  </script>
</body>
</html>
